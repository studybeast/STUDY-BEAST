name: Build Study Beasts

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project
        run: unzip -o -q study-beasts-source.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the APK
        run: gradle assembleDebug --no-daemon

      - name: Rename the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk StudyBeasts.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StudyBeasts-APK
          path: StudyBeasts.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project
        shell: bash
        run: |
          if command -v unzip >/dev/null 2>&1; then
            unzip -o -q study-beasts-source.zip
          else
            7z x -y study-beasts-source.zip > /dev/null
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: desktop
        run: npm install

      - name: Build the installer
        working-directory: desktop
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: StudyBeasts-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error
